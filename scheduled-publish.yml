name: Publish scheduled article

on:
  schedule:
    - cron: '5 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Publish date YYYY-MM-DD (default: today UTC)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Randomize publish time (scheduled runs only)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 36000))
      - name: Publish due article
        run: node scheduled/publish.js "${{ inputs.date }}"
      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "visidocsverse-scheduler"
            git config user.email "scheduler@visidocsverse.com"
            git add -A
            git commit -m "Publish scheduled article"
            git push
          else
            echo "Nothing to publish."
          fi
